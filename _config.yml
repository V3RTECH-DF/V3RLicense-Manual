title: V3RLicense
description: "Manual do usuário do V3RLicense — servidor de licenças dos plugins WordPress da V3RTECH e da RIT."
lang: pt-BR
url: https://docs.v3rlicense.v3rtech.com.br
permalink: pretty

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Tema / cor
color_scheme: v3rlicense
logo: "/assets/logo.svg"

# Busca
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Callouts (admonitions) — mesmos nomes usados nos outros manuais da casa.
callouts:
  note:
    title: Nota
    color: blue
  tip:
    title: Dica
    color: green
  warning:
    title: Atenção
    color: yellow
  important:
    title: Importante
    color: red
  example:
    title: Exemplo
    color: purple

# Links auxiliares (canto superior direito)
aux_links:
  "V3RTECH":
    - "https://v3rtech.com.br"
aux_links_new_tab: true

# Rodapé
footer_content: '© 2026 <a href="https://v3rtech.com.br/" target="_blank" rel="noopener">V3RTECH</a>. Todos os direitos reservados. · <a href="/legal/termos/">Termos de Uso</a> · <a href="/legal/privacidade/">Privacidade</a>'
last_edit_timestamp: false
back_to_top: true
back_to_top_text: "Voltar ao topo"

# Excluir do build (não publicar no site)
exclude:
  - "*.sh"
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
